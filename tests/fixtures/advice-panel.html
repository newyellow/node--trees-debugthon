<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><link rel="stylesheet" href="/src/workspaces/02/advice-panel.css"><title>Advice isolated mock fixture</title><body><button id="trigger">開啟建議</button><main id="fixture"></main><script type="module">
import {createAdvicePanel} from '/src/workspaces/02/advice-panel.js';
window.calls=[];window.vision=0;window.tourCancels=0;window.queue=[];window.pending=[];window.autoTour=true;window.tourHandles=[];
window.answer='這個里的樹木分布提供了綠化起點。可先從既有樹蔭與通行空間觀察，串起鄰里綠網；室內與陽台則依不同光照條件選擇，並保留人寵安全與現地確認。';
window.streamResponse=(data={answer:window.answer,plants:[],sources:[],tour:{kind:'four-region-vision'}})=>{const encoder=new TextEncoder();let timers=[];return new Response(new ReadableStream({start(c){const send=event=>c.enqueue(encoder.encode(JSON.stringify(event)+'\n'));const pieces=Array.from(data.answer),mid=Math.max(1,Math.floor(pieces.length/2));send({type:'delta',text:pieces.slice(0,mid).join('')});timers.push(setTimeout(()=>{send({type:'delta',text:pieces.slice(mid).join('')});send({type:'done',...data});c.close();},1000));},cancel(){timers.forEach(clearTimeout);}}),{headers:{'Content-Type':'application/x-ndjson'}});};
const fetcher=(url,options)=>{window.calls.push({url,body:JSON.parse(options.body),signal:options.signal});const item=window.queue.shift();if(item==='hold')return new Promise(resolve=>window.pending.push(resolve));if(item?.ok===false)return Promise.resolve({ok:false,status:item.status,headers:new Headers(item.headers),json:async()=>({})});return Promise.resolve(window.streamResponse(item?.data));};
window.panel=createAdvicePanel({base:'/review/',container:document.querySelector('#fixture'),fetcher,onVision:()=>{window.vision++;let resolve,timer;const finished=new Promise(done=>{resolve=done;}),finish=reason=>{clearTimeout(timer);resolve(reason);};if(window.autoTour)timer=setTimeout(()=>finish('complete'),10000);const handle={finished,cancel:()=>{window.tourCancels++;finish('cancel');},finish:()=>finish('complete')};window.tourHandles.push(handle);return handle;}});
window.openPanel=(mode='planting',id='v1')=>window.panel.open({village:{id,name:id==='v1'?'測試里':'另一里',district:'測試區'},mode,trigger:document.querySelector('#trigger')});
window.ready=true;
</script></body></html>
